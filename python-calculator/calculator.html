    <script>

        const display =
            document.getElementById("display");


        let firstNumber = null;

        let operator = null;

        let waitingForSecondNumber = false;


        function addNumber(number) {

            if (
                display.value === "0" ||
                waitingForSecondNumber
            ) {

                display.value = number;

                waitingForSecondNumber = false;

            } else {

                display.value += number;

            }

        }


        function addDecimal() {

            if (waitingForSecondNumber) {

                display.value = "0.";

                waitingForSecondNumber = false;

                return;

            }


            if (
                !display.value.includes(".")
            ) {

                display.value += ".";

            }

        }


        function chooseOperator(selectedOperator) {

            const currentNumber =
                parseFloat(display.value);


            if (
                operator !== null &&
                !waitingForSecondNumber
            ) {

                calculate();

            }


            firstNumber = parseFloat(
                display.value
            );

            operator = selectedOperator;

            waitingForSecondNumber = true;

        }


        function calculate() {

            if (
                operator === null ||
                firstNumber === null
            ) {

                return;

            }


            const secondNumber =
                parseFloat(display.value);


            let result;


            if (
                operator === "/" &&
                secondNumber === 0
            ) {

                display.value =
                    "Cannot divide by 0";

                firstNumber = null;

                operator = null;

                waitingForSecondNumber = false;

                return;

            }


            switch (operator) {

                case "+":

                    result =
                        firstNumber + secondNumber;

                    break;


                case "-":

                    result =
                        firstNumber - secondNumber;

                    break;


                case "*":

                    result =
                        firstNumber * secondNumber;

                    break;


                case "/":

                    result =
                        firstNumber / secondNumber;

                    break;


                case "%":

                    result =
                        firstNumber % secondNumber;

                    break;

            }


            display.value =
                Number(result.toFixed(10));


            firstNumber = null;

            operator = null;

            waitingForSecondNumber = false;

        }


        function clearDisplay() {

            display.value = "0";

            firstNumber = null;

            operator = null;

            waitingForSecondNumber = false;

        }


        function deleteLast() {

            if (
                display.value.length > 1
            ) {

                display.value =
                    display.value.slice(0, -1);

            } else {

                display.value = "0";

            }

        }


        document.addEventListener(
            "keydown",
            function(event) {

                const key = event.key;


                if (
                    key >= "0" &&
                    key <= "9"
                ) {

                    addNumber(key);

                }


                else if (
                    key === "."
                ) {

                    addDecimal();

                }


                else if (
                    ["+", "-", "*", "/", "%"]
                    .includes(key)
                ) {

                    chooseOperator(key);

                }


                else if (
                    key === "Enter" ||
                    key === "="
                ) {

                    calculate();

                }


                else if (
                    key === "Escape"
                ) {

                    clearDisplay();

                }


                else if (
                    key === "Backspace"
                ) {

                    deleteLast();

                }

            }
        );

    </script>
