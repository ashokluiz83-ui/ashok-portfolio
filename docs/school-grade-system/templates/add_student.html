```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Student</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <nav>

        <div class="nav-container">

            <div class="nav-links">

                <a href="{{ url_for('dashboard') }}">
                    Home
                </a>

                <a href="{{ url_for('add_student') }}">
                    Add Student
                </a>

                <a href="{{ url_for('view_students') }}">
                    Students
                </a>

                <a href="{{ url_for('search_student') }}">
                    Search
                </a>

                <a href="{{ url_for('classes') }}">
                    Classes
                </a>

                <a href="{{ url_for('statistics') }}">
                    Statistics
                </a>

                <a href="{{ url_for('report') }}">
                    Reports
                </a>

            </div>

        </div>

    </nav>


    <header>

        <h1>
            ➕ Add Student
        </h1>

        <p>
            Enter student information and academic marks.
        </p>

    </header>


    <main>


        <section class="form-card">


            <form
                method="POST"
                action="{{ url_for('add_student') }}"
            >


                <h2>
                    Student Information
                </h2>


                <label for="name">
                    Student Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter student name"
                    required
                >


                <label for="class_name">
                    Class
                </label>

                <select
                    id="class_name"
                    name="class_name"
                    required
                >

                    <option value="">
                        -- Select Class --
                    </option>

                    <option value="1A">
                        1A
                    </option>

                    <option value="1B">
                        1B
                    </option>

                    <option value="2A">
                        2A
                    </option>

                    <option value="2B">
                        2B
                    </option>

                    <option value="3A">
                        3A
                    </option>

                    <option value="3B">
                        3B
                    </option>

                    <option value="4A">
                        4A
                    </option>

                    <option value="4B">
                        4B
                    </option>

                    <option value="5A">
                        5A
                    </option>

                    <option value="5B">
                        5B
                    </option>

                    <option value="6A">
                        6A
                    </option>

                    <option value="6B">
                        6B
                    </option>

                    <option value="7A">
                        7A
                    </option>

                    <option value="7B">
                        7B
                    </option>

                    <option value="8A">
                        8A
                    </option>

                    <option value="8B">
                        8B
                    </option>

                </select>


                <h2>
                    Subjects and Marks
                </h2>


                <div class="subject-row">

                    <input
                        type="text"
                        name="subject_name"
                        value="Mathematics"
                        required
                    >

                    <input
                        type="number"
                        name="subject_mark"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Mark"
                        required
                    >

                </div>


                <div class="subject-row">

                    <input
                        type="text"
                        name="subject_name"
                        value="English"
                        required
                    >

                    <input
                        type="number"
                        name="subject_mark"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Mark"
                        required
                    >

                </div>


                <div class="subject-row">

                    <input
                        type="text"
                        name="subject_name"
                        value="Science"
                        required
                    >

                    <input
                        type="number"
                        name="subject_mark"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Mark"
                        required
                    >

                </div>


                <div class="subject-row">

                    <input
                        type="text"
                        name="subject_name"
                        value="Computer Studies"
                        required
                    >

                    <input
                        type="number"
                        name="subject_mark"
                        min="0"
                        max="100"
                        step="0.1"
                        placeholder="Mark"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="button"
                >
                    💾 Save Student
                </button>


                <a
                    class="button secondary-button"
                    href="{{ url_for('dashboard') }}"
                >
                    Cancel
                </a>


            </form>


        </section>


    </main>


    <footer>

        <p>
            🏫 School Grade System
        </p>

        <p>
            Built with Python + Flask
        </p>

    </footer>


</body>

</html>
